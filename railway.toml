[build]
builder = "NIXPACKS"

[nixpacks.buildPlan.phases.setup]
aptPkgs = ["openssl"]

[nixpacks.buildPlan.phases.install]
cmds = ["cd packages/server && npm install --legacy-peer-deps"]

[nixpacks.buildPlan.phases.build]
cmds = []  # 跳过构建阶段，不执行 TypeScript 编译

[deploy]
startCommand = "bash -c 'cd packages/server && npx prisma@5.22.0 db push --force-reset && npx tsx prisma/seed.ts && npx tsx src/app.ts'"
